name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir el zip del proyecto
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No encontré ningún .zip en la raíz del repositorio."
            exit 1
          fi
          echo "Usando $ZIP"
          DEST="$GITHUB_WORKSPACE/_proyecto"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q -o "$ZIP" -d "$DEST"
          SETTINGS=$(find "$DEST" -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "El zip no contiene un proyecto Gradle (falta settings.gradle.kts)."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Proyecto en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No se generó ningún APK."
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/UltraLauncher.apk"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: UltraLauncher-apk
          path: UltraLauncher.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ultra Launcher build ${{ github.run_number }}
          files: UltraLauncher.apk
